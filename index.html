<style>
  :root{
    --bg-1: #0a0a0c;
    --bg-2: #1c0000;

    --dark-red: #520000;
    --ivory: #f5f7fa;

  }

  *{box-sizing:border-box;}

  body{

    background: #000;

    justify-content: center;

  }
  #intro-screen.fade-out {
    opacity: 0;
    visibility: hidden;
  }
  #intro-screen h1 {

    color: var(--ivory);

    text-align: center;
  }

    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 1;
  }
  #main-ui.show {
    opacity: 1;
  }

  .bg-video-wrap{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    opacity:.4;
    pointer-events:none;
  }

  .bg-video{
    position:absolute;
    top:50%; left:50%;
    width:177.77vh;
    height:56.25vw;
    min-width:100%;
    min-height:100%;

  .tint-overlay{

    inset:0;
    z-index:0;

    background: linear-gradient(135deg, rgba(211, 17, 24, 0.4) 0%, rgba(10, 10, 12, 0.9) 100%);

    pointer-events:none;
  }

  .stars{

    pointer-events:none;

      radial-gradient(1.5px 1.5px at 80% 10%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 30% 85%, rgba(255,255,255,.4), transparent),

    background-size: 100% 100%;

  header{
    text-align:center;
    max-width:520px;
    margin-bottom:36px;
    position:relative;
  }

  .eyebrow{
    color:var(--primary-red);
    font-size:14px;
    font-weight:600;
    letter-spacing:.06em;
    margin-bottom:10px;
  }

  h1{
    font-family:'Noto Serif Thai', serif;
    font-weight:700;
    font-size:clamp(28px, 5.5vw, 42px);
    margin:0 0 14px;
    line-height:1.25;
  }

  header p{
    color:var(--muted);
    font-size:16px;
    line-height:1.7;
    margin:0;
  }

  .wheel-zone{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:8px;
  }

  .pointer{
    width:0;
    height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--primary-red);
    filter:drop-shadow(0 0 8px var(--primary-red));
    margin-bottom:-6px;
    z-index:3;
  }

  .wheel-outer{
    position:relative;
    width:min(78vw, 380px);
    height:min(78vw, 380px);
    border-radius:50%;
    padding:10px;
    /* เปลี่ยนขอบวงล้อเป็นกราเดี้ยน แดง-ดำ */
    background:linear-gradient(135deg, var(--primary-red), #000000 70%, var(--dark-red));

      0 30px 60px -20px rgba(0,0,0,.9),

  }

  .wheel{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    /* เปลี่ยนสีในวงล้อเป็น ขาว-เทา */
    background:conic-gradient(

    will-change: transform;
  }

    position:absolute;
    top:0; left:50%;
    width:1px; height:50%;
    background:rgba(0,0,0,.15);
    transform-origin: bottom center;
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    width:64px; height:64px;

    align-items:center;
    justify-content:center;
    box-shadow:0 0 15px var(--primary-red);

    height: auto;
  }

  .spin-btn{
    margin-top:34px;

    border:none;
    font-family:'Noto Serif Thai', serif;
    font-weight:600;
    font-size:18px;
    padding:14px 38px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 0 20px -5px var(--primary-red);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .spin-btn:hover{ transform:translateY(-2px); box-shadow:0 0 25px 0px var(--primary-red); }
  .spin-btn:active{ transform:translateY(0); }
  .spin-btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }

  /* ปรับแก้ Result ให้เป็น Pop-up Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(4px);
    z-index: 49;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .modal-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }

  .result{
    position:fixed;
    top:50%; left:50%;
    z-index:50;
    width: 90%;
    max-width: 420px;
    padding:30px 24px;
    border-radius:20px;
    background: linear-gradient(180deg, #1a0505 0%, #0a0a0c 100%);
    border:1px solid var(--primary-red);
    box-shadow: 0 10px 40px rgba(211,17,24,0.3);
    text-align:center;
    opacity:0;
    transform:translate(-50%, -40%) scale(.95);
    transition:opacity .4s ease, transform .4s ease;
    pointer-events:none;
  }
  .result.show{
    opacity:1;
    transform:translate(-50%, -50%) scale(1);
    pointer-events:auto;
  }
  .result .label{
    color:var(--primary-red);
    font-size:14px;
    font-weight:600;
    letter-spacing:.05em;
    margin-bottom:16px;
  }
  
  .result p{
    font-family:'Sarabun', sans-serif;
    font-size:clamp(15px, 3.5vw, 17px);
    font-weight: 300;
    line-height:1.6;
    margin:0 0 24px;
    color: var(--ivory);
    text-align: left;
  }

  .close-btn {
    background: transparent;
    color: var(--ivory);
    border: 1px solid var(--muted);
    padding: 8px 24px;
    border-radius: 99px;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .close-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--ivory);
  }

  footer{
    margin-top:56px;
    color:var(--muted);
    font-size:13px;
    text-align:center;
  }
</style>
</head>

    "แทนที่จะผลักดันตัวเองหนักเกินไป หยุด หายใจ และประเมินใหม่ คุณกำลังทำมากพอแล้ว แม้ว่าจะไม่รู้สึกเช่นนั้นก็ตาม อย่าทำให้ตัวเองเหนื่อยจนหมดแรง มันไม่คุ้มค่า! จัดสรรเวลาอย่างชาญฉลาดมากขึ้น",
    "กลับไปสู่หัวใจของตัวตนที่แท้จริงของคุณ ที่นั่นคุณจะพบกับความสงบ มองชีวิตของคุณในภาพรวม ยอมรับบาดแผลเก่า ๆ แล้วปล่อยวาง ใช้สิ่งที่มันสอนคุณเป็นพลังเพิ่มเติม ก้าวไปข้างหน้าด้วยความมั่นใจใหม่",
    "อย่าให้ใครมาทำร้ายอำนาจของคุณหรือพรากมันไปจากคุณ จำไว้ว่าคุณจะได้รับการปฏิบัติตามที่คุณยอมให้คนอื่นปฏิบัติต่อคุณ แสดงให้พวกเขาเห็นว่าคุณให้คุณค่ากับตัวเองมากเกินกว่าที่จะยอมรับสิ่งที่น้อยกว่าที่คุณสมควรได้รับ",
    "ที่ที่คุณอยู่ตอนนี้ มันถูกที่ถูกทางแล้ว อย่าเอาตัวเองไปเปรียบเทียบกับคนอื่น มันจะเพิ่มความกดดันให้คุณ ทำวันนี้ให้ดีที่สุด คุณในวันนี้ดีกว่าคุณคนเมื่อวานเสมอ การเติบโตไม่ใช่เรื่องง่าย แต่คุณทำได้",
    "ไม่ว่าตอนนี้คุณจะถูกทดสอบหรือถูกกดดันมากแค่ไหน จงยืนหยัดและสู้กลับไป เชื่อในตัวของคุณเองและคุณค่าของตัวเองให้มากพอที่จะไม่ไม่ปล่อยให้ใครมาทำให้คุณไขว้เขวได้ มีความมั่นใจที่จะก้าวไปข้างหน้า คุณทำได้และจะทำได้สำเร็จ"
  ];

  const wheel = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const result = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const closeBtn = document.getElementById('closeBtn');

  // วาดเส้นแบ่งช่องวงล้อ (ไม่มีไอคอน)
  for (let i = 0; i < 12; i++) {
    const div = document.createElement('div');
    div.className = 'divider';
    div.style.transform = `rotate(${i * 30}deg)`;
    wheel.appendChild(div);
  }

  // อนิเมชัน Intro หน้าแรก
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('intro-screen').classList.add('fade-out');
      document.getElementById('main-ui').classList.add('show');
    }, 2200); // ดีเลย์ 2.2 วินาทีก่อนเฟดออก
  });

  let currentRotation = 0;
  let spinning = false;

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;

    // สุ่มผลลัพธ์
    const textIdx = Math.floor(Math.random() * fortunes.length);
    
    // สุ่มช่องบนหน้าปัดวงล้อ (0 ถึง 11) เพื่อให้หมุนสุ่ม
    const targetSegment = Math.floor(Math.random() * 12);
    
    // คำนวณองศาหมุน
    const landAngle = 360 - (targetSegment * 30 + 15);
    const currentMod = currentRotation % 360;
    let offsetToTarget = landAngle - currentMod;
    if (offsetToTarget < 0) offsetToTarget += 360;
    
    const extraTurns = 5 + Math.floor(Math.random() * 3);
    currentRotation += (extraTurns * 360) + offsetToTarget;
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    const onEnd = () => {
      wheel.removeEventListener('transitionend', onEnd);
      resultText.textContent = fortunes[textIdx];
      // แสดง Modal Pop-up
      modalBackdrop.classList.add('show');
      result.classList.add('show');
      spinning = false;
      spinBtn.disabled = false;
    };
    wheel.addEventListener('transitionend', onEnd);
  }

  function closeModal() {
    modalBackdrop.classList.remove('show');
    result.classList.remove('show');
  }

  spinBtn.addEventListener('click', spin);
  closeBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', closeModal);
</script>

</body>
</html>
