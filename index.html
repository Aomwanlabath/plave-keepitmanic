<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAVE KEEP IT MANIC Giveaway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #0a0c14;
    --bg-2: #161026;
    --neon-blue: #00f0ff;
    --neon-purple: #b620e0;
    --ivory: #f5f7fa;
    --muted: #8b92a5;
    
    /* PLAVE Member Colors */
    --yejun: #0078FF;
    --noah: #8a2be2;
    --bamby: #ff69b4;
    --eunho: #ff3333;
    --hamin: #1dd1a1;
    --asterum: #e2e8f0;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:transparent;
    color:var(--ivory);
    font-family:'Sarabun', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 64px;
    overflow-x:hidden;
  }

  .bg-video-wrap{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    opacity:.4;
    pointer-events:none;
  }

  .bg-video{
    position:absolute;
    top:50%; left:50%;
    width:177.77vh;
    height:56.25vw;
    min-width:100%;
    min-height:100%;
    transform:translate(-50%,-50%);
    border:none;
  }

  .tint-overlay{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(0, 240, 255, 0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(182, 32, 224, 0.15), transparent 45%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    opacity:.7;
    pointer-events:none;
  }

  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 80% 10%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 30% 85%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 45% 40%, rgba(255,255,255,.35), transparent);
    background-size: 100% 100%;
  }

  header{
    text-align:center;
    max-width:520px;
    margin-bottom:36px;
    position:relative;
    z-index:1;
  }

  .eyebrow{
    color:var(--neon-blue);
    font-size:14px;
    font-weight:600;
    letter-spacing:.06em;
    margin-bottom:10px;
    text-shadow: 0 0 8px rgba(0,240,255,0.4);
  }

  h1{
    font-family:'Noto Serif Thai', serif;
    font-weight:700;
    font-size:clamp(28px, 5.5vw, 42px);
    margin:0 0 14px;
    line-height:1.25;
  }

  header p{
    color:var(--muted);
    font-size:16px;
    line-height:1.7;
    margin:0;
  }

  .wheel-zone{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:8px;
  }

  .pointer{
    width:0;
    height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--neon-blue);
    filter:drop-shadow(0 0 10px var(--neon-blue));
    margin-bottom:-6px;
    z-index:3;
  }

  .wheel-outer{
    position:relative;
    width:min(78vw, 380px);
    height:min(78vw, 380px);
    border-radius:50%;
    padding:10px;
    background:linear-gradient(135deg, var(--neon-blue), #2b1055 60%, var(--neon-purple));
    box-shadow:
      0 0 0 2px rgba(0,240,255,.3),
      0 30px 60px -20px rgba(0,0,0,.8),
      0 0 60px rgba(182,32,224,.15);
  }

  .wheel{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    background:conic-gradient(
      var(--yejun) 0deg 30deg,   var(--noah) 30deg 60deg,
      var(--bamby) 60deg 90deg,  var(--eunho) 90deg 120deg,
      var(--hamin) 120deg 150deg, var(--asterum) 150deg 180deg,
      var(--yejun) 180deg 210deg, var(--noah) 210deg 240deg,
      var(--bamby) 240deg 270deg, var(--eunho) 270deg 300deg,
      var(--hamin) 300deg 330deg, var(--asterum) 330deg 360deg
    );
    box-shadow: inset 0 0 30px rgba(0,0,0,.7), inset 0 0 0 2px rgba(255,255,255,.1);
    transition: transform 4.2s cubic-bezier(.16,.85,.2,1);
    will-change: transform;
  }

  .wheel .divider{
    position:absolute;
    top:0; left:50%;
    width:1px; height:50%;
    background:rgba(255,255,255,.2);
    transform-origin: bottom center;
  }

  .wheel .mark{
    position:absolute;
    top:50%; left:50%;
    width:0; height:0;
    transform-origin:0 0;
  }
  .wheel .mark span{
    position:absolute;
    left:-12px; top:-12px;
    display:block;
    font-size:20px;
    text-shadow:0 0 10px rgba(255,255,255,.6);
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    width:64px; height:64px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a2a35, #0a0a0c 75%);
    border:2px solid var(--neon-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 0 15px var(--neon-blue);
    z-index:2;
  }

  .spin-btn{
    margin-top:34px;
    background:linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    color:#fff;
    border:none;
    font-family:'Noto Serif Thai', serif;
    font-weight:600;
    font-size:18px;
    padding:14px 38px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 0 20px -5px var(--neon-purple);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .spin-btn:hover{ transform:translateY(-2px); box-shadow:0 0 25px 0px var(--neon-blue); }
  .spin-btn:active{ transform:translateY(0); }
  .spin-btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
  .spin-btn:focus-visible{ outline:2px solid var(--neon-blue); outline-offset:3px; }

  .result{
    position:relative;
    z-index:1;
    max-width:480px;
    width:100%;
    margin-top:40px;
    padding:30px 28px;
    border-radius:20px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(0,240,255,.3);
    text-align:center;
    opacity:0;
    transform:translateY(14px) scale(.98);
    transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  .result.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .result .label{
    color:var(--neon-blue);
    font-size:13px;
    font-weight:600;
    letter-spacing:.05em;
    margin-bottom:12px;
  }
  .result p{
    font-family:'Noto Serif Thai', serif;
    font-size:clamp(18px, 3.2vw, 22px);
    line-height:1.7;
    margin:0;
  }

  footer{
    margin-top:56px;
    color:var(--muted);
    font-size:13px;
    text-align:center;
    z-index:1;
  }
</style>
</head>
<body>

<div class="bg-video-wrap">
  <iframe class="bg-video"
    src="https://www.youtube.com/embed/nmbZjQ_mZ7c?autoplay=1&mute=1&loop=1&playlist=nmbZjQ_mZ7c&controls=0&showinfo=0&modestbranding=1&rel=0&playsinline=1"
    allow="autoplay; encrypted-media" allowfullscreen>
  </iframe>
</div>
<div class="tint-overlay"></div>
<div class="stars"></div>

<header>
  <div class="eyebrow">PLAVE KEEP IT MANIC TOUR 2026</div>
  <h1>Unlock your destiny in Asterum</h1>
  <p>เชื่อมต่อระบบเพื่อรับคำทำนายและของที่ระลึกหน้าคอนเสิร์ตจาก 5 หนุ่ม</p>
</header>

<div class="wheel-zone">
  <div class="pointer"></div>
  <div class="wheel-outer">
    <div class="wheel" id="wheel">
      <div class="hub">👽</div>
    </div>
  </div>
  <button class="spin-btn" id="spinBtn">เชื่อมต่อระบบ (Spin)</button>
</div>

<div class="result" id="result">
  <div class="label">ผลลัพธ์การเชื่อมต่อ</div>
  <p id="resultText">—</p>
</div>

<footer>PLLI GIVEAWAY 🌟</footer>

<script>
  // ข้อมูลผลลัพธ์ 6 รูปแบบ เรียงลำดับตามช่องสี (เยจุน, โนอา, แบมบี้, อึนโฮ, ฮามิน, รวมวง/พิเศษ)
  const fortunes = [
    "💙 กัปตันเยจุนยืนยันการเชื่อมต่อ! วันนี้คุณจะเต็มไปด้วยรอยยิ้มและความสดใส (รับการ์ด/ของแจก: เยจุน)",
    "💜 โนอาร่ายมนตร์ Asterum ใส่คุณแล้ว! เสน่ห์ของคุณจะโดดเด่นที่สุดในงานนี้ (รับการ์ด/ของแจก: โนอา)",
    "🩷 แบมบี้ขยิบตาให้คุณหนึ่งที! พลังงานความน่ารักจะช่วยชาร์จแบตให้คุณมีแรงโดดทั้งวัน (รับการ์ด/ของแจก: แบมบี้)",
    "❤️ เอเนอร์จี้ของอึนโฮพุ่งปรี๊ด! เตรียมตัวรับความมันส์แบบทะลุปรอทใน KEEP IT MANIC ได้เลย (รับการ์ด/ของแจก: อึนโฮ)",
    "🖤💚 ฮามินแฮ็กระบบเพิ่มความโชคดีให้คุณแล้ว! วันนี้สุ่มอะไรก็เข้าข้างคุณแน่นอน (รับการ์ด/ของแจก: ฮามิน)",
    "🌌 ระบบ Asterum สุ่มโบนัสพิเศษ! คุณคือ PLLI ผู้โชคดีที่ได้รับรางวัลรวมเซ็ต! (รับของแจก: Special Set/รวมวง)"
  ];

  const wheel = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const result = document.getElementById('result');
  const resultText = document.getElementById('resultText');

  // อีโมจิตัวแทนเมมเบอร์บนหน้าปัดวงล้อ (12 ช่อง)
  const marksIcons = ['🐬','🦙','🦌','🐺','🐈‍⬛','🌌', '🐬','🦙','🦌','🐺','🐈‍⬛','🌌'];
  for (let i = 0; i < 12; i++) {
    const div = document.createElement('div');
    div.className = 'divider';
    div.style.transform = `rotate(${i * 30}deg)`;
    wheel.appendChild(div);

    const mark = document.createElement('div');
    mark.className = 'mark';
    mark.style.transform = `rotate(${i * 30 + 15}deg) translate(0, -125px)`;
    const span = document.createElement('span');
    span.textContent = marksIcons[i];
    mark.appendChild(span);
    wheel.appendChild(mark);
  }

  let currentRotation = 0;
  let spinning = false;

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    result.classList.remove('show');

    // สุ่มผลลัพธ์ (0 ถึง 5)
    const idx = Math.floor(Math.random() * fortunes.length);
    
    // เลือกช่องที่จะให้เข็มไปตก (มี 2 ฝั่งบนหน้าปัด คือ idx หรือ idx+6)
    const targetSegment = idx + (Math.random() < 0.5 ? 0 : 6);
    
    // คำนวณองศาเป้าหมายเพื่อให้เข็ม (0 องศา) ชี้เข้ากึ่งกลางของช่องเป๊ะๆ
    const landAngle = 360 - (targetSegment * 30 + 15);
    
    // คำนวณระยะที่ต้องหมุนเพิ่มจากองศาปัจจุบัน
    const currentMod = currentRotation % 360;
    let offsetToTarget = landAngle - currentMod;
    if (offsetToTarget < 0) offsetToTarget += 360;
    
    const extraTurns = 5 + Math.floor(Math.random() * 3); // หมุนฟรี 5-7 รอบ
    currentRotation += (extraTurns * 360) + offsetToTarget;
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    const onEnd = () => {
      wheel.removeEventListener('transitionend', onEnd);
      resultText.textContent = fortunes[idx];
      result.classList.add('show');
      spinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = 'เชื่อมต่ออีกครั้ง';
    };
    wheel.addEventListener('transitionend', onEnd);
  }

  spinBtn.addEventListener('click', spin);
</script>

</body>
</html>
