<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--primary-red:#d31118;--neon-red:#ff2a31;--ivory:#f5f7fa;--muted:#8b92a5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000;color:var(--ivory);font-family:Sarabun,sans-serif;display:flex;flex-direction:column;align-items:center;padding:48px 20px 64px;overflow-x:hidden}
#intro-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity 1s ease,visibility 1s ease}#intro-screen.fade-out{opacity:0;visibility:hidden}#intro-screen img{max-width:80%;max-height:80vh;object-fit:contain;filter:drop-shadow(0 0 20px rgba(211,17,24,.4));animation:slow-pulse 2.5s ease-in-out infinite alternate}@keyframes slow-pulse{0%{transform:scale(.98);opacity:.8}100%{transform:scale(1.02);opacity:1}}
#main-ui{opacity:0;transition:opacity 1s ease .5s;display:flex;flex-direction:column;align-items:center;width:100%;z-index:1;flex-grow:1;justify-content:center}#main-ui.show{opacity:1}.bg-video-wrap{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;pointer-events:none}.tint-overlay{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at center,rgba(0,0,0,.15),rgba(0,0,0,.85));background-color:rgba(10,0,0,.3);mix-blend-mode:multiply;pointer-events:none}.stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,rgba(211,17,24,.3),transparent),radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,.2),transparent),radial-gradient(1.5px 1.5px at 60% 70%,rgba(211,17,24,.4),transparent),radial-gradient(1px 1px at 30% 85%,rgba(255,255,255,.2),transparent)}
header{text-align:center;max-width:520px;margin-bottom:48px;position:relative}.eyebrow{color:var(--primary-red);font-size:14px;font-weight:600;letter-spacing:.06em;margin-bottom:10px}h1{font-family:'Noto Serif Thai',sans-serif;font-weight:700;font-size:clamp(28px,5.5vw,42px);margin:0 0 14px;line-height:1.25}header p{color:var(--muted);font-size:16px;line-height:1.7;margin:0}.sync-zone{position:relative;display:flex;flex-direction:column;align-items:center}.sync-node{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}.orbital-ring{position:absolute;border-radius:50%;border:1px solid rgba(211,17,24,.3);box-shadow:0 0 15px rgba(211,17,24,.1) inset,0 0 10px rgba(211,17,24,.2);pointer-events:none}.ring-1{width:100%;height:100%;border-top-color:var(--primary-red);border-bottom-color:var(--primary-red);animation:spin-slow 8s linear infinite}.ring-2{width:75%;height:75%;border-left-color:var(--neon-red);border-right-color:var(--neon-red);animation:spin-fast 5s linear infinite reverse}.ring-3{width:55%;height:55%;border:1px dashed rgba(255,255,255,.2);animation:spin-slow 12s linear infinite}.node-core{position:relative;width:80px;height:80px;background:radial-gradient(circle,#1a0000,#000);border:2px solid var(--primary-red);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(211,17,24,.5);z-index:2;transition:all .2s ease}.node-core img{width:60%;height:auto}.sync-node:hover .node-core{transform:scale(1.05);box-shadow:0 0 40px var(--neon-red)}.sync-node:active .node-core{transform:scale(.95)}.sync-node.is-syncing .ring-1{animation:spin-fast .8s linear infinite;border-color:var(--ivory)}.sync-node.is-syncing .ring-2{animation:spin-fast .5s linear infinite reverse;border-color:var(--ivory)}.sync-node.is-syncing .node-core{border-color:var(--ivory);box-shadow:0 0 50px rgba(255,255,255,.8);background:#fff}.tap-hint{margin-top:32px;font-size:13px;font-weight:600;letter-spacing:.15em;color:var(--primary-red);text-transform:uppercase;animation:pulse 2s ease-in-out infinite;pointer-events:none}.sync-node.is-syncing+.tap-hint{opacity:0}@keyframes spin-slow{100%{transform:rotate(360deg)}}@keyframes spin-fast{100%{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1;text-shadow:0 0 10px var(--primary-red)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:49;opacity:0;pointer-events:none;transition:opacity .4s ease}.modal-backdrop.show{opacity:1;pointer-events:auto}.result{--theme-color:#d31118;position:fixed;top:50%;left:50%;z-index:50;width:92%;max-width:440px;background:rgba(10,10,15,.9);border:1px solid var(--theme-color);box-shadow:0 0 30px rgba(0,0,0,.9),inset 0 0 15px var(--theme-color);text-align:left;opacity:0;transform:translate(-50%,-40%) scale(.95);transition:opacity .4s ease,transform .4s ease;pointer-events:none;clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px)}.result.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}.result-inner{padding:30px 24px;border:1px dashed rgba(255,255,255,.15);margin:4px}.result .label{display:flex;justify-content:space-between;align-items:center;color:var(--theme-color);font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:.1em;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--theme-color)}.result .status{font-size:11px;color:var(--ivory);background:var(--theme-color);padding:2px 6px}.result p{font-size:clamp(15px,3.5vw,17px);font-weight:300;line-height:1.7;margin:0 0 32px}.close-btn{display:block;width:100%;background:rgba(0,0,0,.5);color:var(--theme-color);border:1px solid var(--theme-color);padding:12px;font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:.1em;cursor:pointer}.close-btn:hover{background:var(--theme-color);color:#fff}footer{margin-top:auto;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div id="intro-screen"><img src="https://cdn.kpopping.com/tours/2026-plave-world-tour-keep-it-manic/logo.png?v=1782461565734" alt="Intro Image"></div>
<div class="bg-video-wrap"><video class="bg-video" autoplay loop muted playsinline><source src="https://www.image2url.com/r2/default/videos/1790086754968-f4d1862d-c4ba-4dda-a2a2-23cf1573989d.mp4" type="video/mp4"></video></div>
<div class="tint-overlay"></div><div class="stars"></div><div class="modal-backdrop" id="modalBackdrop"></div>
<div id="main-ui"><header><div class="eyebrow">PLAVE KEEP IT MANIC TOUR 2026</div><h1>Unlock your destiny in Asterum</h1><p>สแกนความถี่จาก Asterum เพื่อรับข้อความที่จักรวาลอยากบอกคุณในวันนี้</p></header><div class="sync-zone"><div class="sync-node" id="syncNode"><div class="orbital-ring ring-1"></div><div class="orbital-ring ring-2"></div><div class="orbital-ring ring-3"></div><div class="node-core"><img src="https://vlast.com/wp-content/uploads/2023/12/plave_logo_wh.svg" alt="PLAVE Logo"></div></div><div class="tap-hint">Tap to Sync</div></div><footer>PLLI GIVEAWAY 🌟</footer></div>
<div class="result" id="result"><div class="result-inner"><div class="label"><span id="senderName">INCOMING: UNKNOWN</span><span class="status">DECRYPTED</span></div><p id="resultText">—</p><button class="close-btn" id="closeBtn">CLOSE TRANSMISSION</button></div></div>
<script>
const membersData = [
  {id:'yejun',name:'YEJUN (เยจุน)',color:'#0078FF',messages:['อย่ายอมให้ใครมองข้ามคุณ คุณมีคุณค่าเสมอ','เชื่อมั่นในตัวเองและภูมิใจในความก้าวหน้าของคุณ','ค่อย ๆ เดินไป ไม่จำเป็นต้องรีบร้อน']},
  {id:'noah',name:'NOAH (โนอา)',color:'#8a2be2',messages:['อย่าเปรียบเทียบความสำเร็จของคุณกับคนอื่น','เชื่อมั่นในการรอคอย สิ่งดี ๆ กำลังเตรียมพร้อมสำหรับคุณ','ก้าวต่อไป แม้ยังไม่เห็นจุดหมายที่ชัดเจน']},
  {id:'bamby',name:'BAMBY (แบมบี้)',color:'#ff69b4',messages:['คุณกำลังทำดีที่สุดแล้ว และนั่นก็เพียงพอ','ปล่อยวางสิ่งเก่าเพื่อเปิดทางให้สิ่งใหม่','พักผ่อนและฟื้นฟูพลังของตัวเองบ้าง']},
  {id:'eunho',name:'EUNHO (อึนโฮ)',color:'#ff3333',messages:['จงเป็นตัวของตัวเองในทุกสิ่ง','โฟกัสกับสิ่งที่คุณควบคุมได้','วันนี้คือโอกาสสำหรับการเริ่มต้นใหม่']},
  {id:'hamin',name:'HAMIN (ฮามิน)',color:'#1dd1a1',messages:['หยุด หายใจ และประเมินสถานการณ์ใหม่','ยอมรับทุกส่วนของตัวเอง ทั้งด้านดีและด้านที่กำลังพัฒนา','คุณอยู่ในจุดที่ถูกต้องและกำลังเติบโต']}
];
const syncNode=document.getElementById('syncNode');
const result=document.getElementById('result');
const resultText=document.getElementById('resultText');
const senderName=document.getElementById('senderName');
const modalBackdrop=document.getElementById('modalBackdrop');
const closeBtn=document.getElementById('closeBtn');
window.addEventListener('load',()=>setTimeout(()=>{document.getElementById('intro-screen').classList.add('fade-out');document.getElementById('main-ui').classList.add('show')},2800));
let isSyncing=false;
function triggerSync(){if(isSyncing)return;isSyncing=true;syncNode.classList.add('is-syncing');const member=membersData[Math.floor(Math.random()*membersData.length)];const message=member.messages[Math.floor(Math.random()*member.messages.length)];setTimeout(()=>{syncNode.classList.remove('is-syncing');senderName.textContent=`INCOMING FROM: ${member.name}`;resultText.textContent=message;result.style.setProperty('--theme-color',member.color);modalBackdrop.classList.add('show');result.classList.add('show');isSyncing=false},2000)}
function closeModal(){modalBackdrop.classList.remove('show');result.classList.remove('show')}
syncNode.addEventListener('click',triggerSync);closeBtn.addEventListener('click',closeModal);modalBackdrop.addEventListener('click',closeModal);
</script>
</body>
</html>
