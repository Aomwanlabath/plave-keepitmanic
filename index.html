<style>
  :root{

  body{

    display:flex;
    flex-direction:column;
    align-items:center;

  .bg-video-wrap{

  .stars{

      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 45% 40%, rgba(255,255,255,.35), transparent);
    background-size: 100% 100%;
  }

  header{
    text-align:center;
    max-width:520px;
    margin-bottom:36px;

  .eyebrow{

  .wheel-zone{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:8px;
  }

  .pointer{
    width:0;
    height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--neon-blue);

    z-index:3;

  .wheel-outer{
    position:relative;
    width:min(78vw, 380px);
    height:min(78vw, 380px);
    border-radius:50%;
    padding:10px;
    background:linear-gradient(135deg, var(--neon-blue), #2b1055 60%, var(--neon-purple));

  .wheel{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    background:conic-gradient(
      var(--yejun) 0deg 30deg,   var(--noah) 30deg 60deg,

    display:block;
    font-size:20px;
    text-shadow:0 0 10px rgba(255,255,255,.6);
  }

    font-size:18px;

    box-shadow:0 0 20px -5px var(--neon-purple);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .spin-btn:hover{ transform:translateY(-2px); box-shadow:0 0 25px 0px var(--neon-blue); }
  .spin-btn:active{ transform:translateY(0); }
  .spin-btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
  .spin-btn:focus-visible{ outline:2px solid var(--neon-blue); outline-offset:3px; }

  .result{
    position:relative;
    z-index:1;
    max-width:480px;
    width:100%;
    margin-top:40px;
    padding:24px 20px;
    border-radius:20px;
    background:rgba(255,255,255,.08);

    border:1px solid rgba(0,240,255,.3);
    text-align:center;
    opacity:0;
    transform:translateY(14px) scale(.98);
    transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  .result.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .result .label{
    color:var(--neon-blue);
    font-size:14px;
    font-weight:600;
    letter-spacing:.05em;
    margin-bottom:12px;

    "อย่าให้ใครมาทำร้ายอำนาจของคุณหรือพรากมันไปจากคุณ จำไว้ว่าคุณจะได้รับการปฏิบัติตามที่คุณยอมให้คนอื่นปฏิบัติต่อคุณ แสดงให้พวกเขาเห็นว่าคุณให้คุณค่ากับตัวเองมากเกินกว่าที่จะยอมรับสิ่งที่น้อยกว่าที่คุณสมควรได้รับ",
    "ที่ที่คุณอยู่ตอนนี้ มันถูกที่ถูกทางแล้ว อย่าเอาตัวเองไปเปรียบเทียบกับคนอื่น มันจะเพิ่มความกดดันให้คุณ ทำวันนี้ให้ดีที่สุด คุณในวันนี้ดีกว่าคุณคนเมื่อวานเสมอ การเติบโตไม่ใช่เรื่องง่าย แต่คุณทำได้",
    "ไม่ว่าตอนนี้คุณจะถูกทดสอบหรือถูกกดดันมากแค่ไหน จงยืนหยัดและสู้กลับไป เชื่อในตัวของคุณเองและคุณค่าของตัวเองให้มากพอที่จะไม่ไม่ปล่อยให้ใครมาทำให้คุณไขว้เขวได้ มีความมั่นใจที่จะก้าวไปข้างหน้า คุณทำได้และจะทำได้สำเร็จ"
  ];

  const labels = [
    "💙 คลื่นความถี่จากเยจุน:",
    "💜 คลื่นความถี่จากโนอา:",
    "🩷 คลื่นความถี่จากแบมบี้:",
    "❤️ คลื่นความถี่จากอึนโฮ:",
    "🖤💚 คลื่นความถี่จากฮามิน:",
    "🌌 ข้อความจาก Asterum:"
  ];

  const wheel = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const result = document.getElementById('result');
  const resultLabel = document.getElementById('resultLabel');
  const resultText = document.getElementById('resultText');

  const marksIcons = ['🐬','🦙','🦌','🐺','🐈‍⬛','🌌', '🐬','🦙','🦌','🐺','🐈‍⬛','🌌'];
  for (let i = 0; i < 12; i++) {
    const div = document.createElement('div');
    div.className = 'divider';
    div.style.transform = `rotate(${i * 30}deg)`;
    wheel.appendChild(div);

    const mark = document.createElement('div');
    mark.className = 'mark';
    mark.style.transform = `rotate(${i * 30 + 15}deg) translate(0, -125px)`;
    const span = document.createElement('span');
    span.textContent = marksIcons[i];
    mark.appendChild(span);
    wheel.appendChild(mark);
  }

  let currentRotation = 0;
  let spinning = false;

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    result.classList.remove('show');

    // สุ่มผลลัพธ์จากข้อความทำนาย 54 ข้อ
    const textIdx = Math.floor(Math.random() * fortunes.length);
    
    // สุ่มช่องบนหน้าปัดวงล้อ (0 ถึง 11) เพื่อให้ลอจิกหน้าปัดและข้อความทำงานแยกกันอย่างอิสระ
    const targetSegment = Math.floor(Math.random() * 12);
    
    // หาสี/คน ที่หน้าปัดไปตก (0-5)
    const labelIdx = targetSegment % 6;
    
    // คำนวณองศาหมุน
    const landAngle = 360 - (targetSegment * 30 + 15);
    const currentMod = currentRotation % 360;
    let offsetToTarget = landAngle - currentMod;
    if (offsetToTarget < 0) offsetToTarget += 360;
    
    const extraTurns = 5 + Math.floor(Math.random() * 3);
    currentRotation += (extraTurns * 360) + offsetToTarget;
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    const onEnd = () => {
      wheel.removeEventListener('transitionend', onEnd);
      resultLabel.textContent = labels[labelIdx];
      resultText.textContent = fortunes[textIdx];
      result.classList.add('show');
      spinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = 'เชื่อมต่ออีกครั้ง';
    };
    wheel.addEventListener('transitionend', onEnd);
  }

  spinBtn.addEventListener('click', spin);
</script>

</body>
</html>
