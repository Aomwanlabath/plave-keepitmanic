<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAVE KEEP IT MANIC Giveaway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #000000;
    --primary-red: #d31118;
    --dark-red: #520000;
    --neon-red: #ff2a31;
    --ivory: #f5f7fa;
    --muted: #8b92a5;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:var(--ivory);
    font-family:'Sarabun', Montserrat, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 64px;
    overflow-x:hidden;
  }

  #intro-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 1s ease, visibility 1s ease;
  }
  #intro-screen.fade-out {
    opacity: 0;
    visibility: hidden;
  }
  #intro-screen img {
    max-width: 80%;
    max-height: 80vh;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(211, 17, 24, 0.4));
    animation: slow-pulse 2.5s ease-in-out infinite alternate;
  }

  @keyframes slow-pulse {
    0% { transform: scale(0.98); opacity: 0.8; }
    100% { transform: scale(1.02); opacity: 1; }
  }

  #main-ui {
    opacity: 0;
    transition: opacity 1s ease 0.5s;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 1;
    flex-grow: 1;
    justify-content: center;
  }
  #main-ui.show {
    opacity: 1;
  }

  .bg-video-wrap{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }

  .bg-video{
    position:absolute;
    top:50%; left:50%;
    width:100%;
    height:100%;
    min-width: 177.77vh; 
    min-height: 56.25vw;
    transform:translate(-50%,-50%);
    object-fit: cover;
    opacity: 0.85;
    pointer-events:none;
  }

  .tint-overlay{
    position:fixed;
    inset:0;
    z-index:0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.85) 100%);
    background-color: rgba(10, 0, 0, 0.3);
    mix-blend-mode: multiply;
    pointer-events:none;
  }

  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(211,17,24,.3), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.2), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(211,17,24,.4), transparent),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,.2), transparent);
    background-size: 100% 100%;
    opacity: 0.75;
  }

  header{
    text-align:center;
    max-width:520px;
    margin-bottom:48px;
    position:relative;
  }

  .eyebrow{
    color:var(--primary-red);
    font-size:14px;
    font-weight:600;
    letter-spacing:.06em;
    margin-bottom:10px;
  }

  h1{
    font-family:'Noto Serif Thai', Montserrat, sans-serif;
    font-weight:700;
    font-size:clamp(28px, 5.5vw, 42px);
    margin:0 0 14px;
    line-height:1.25;
  }

  header p{
    color:var(--muted);
    font-size:16px;
    line-height:1.7;
    margin:0;
  }

  .sync-zone {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .sync-node {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .orbital-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(211, 17, 24, 0.3);
    box-shadow: 0 0 15px rgba(211, 17, 24, 0.1) inset, 0 0 10px rgba(211, 17, 24, 0.2);
    transition: all 0.3s ease;
    pointer-events: none;
  }

  .ring-1 {
    width: 100%;
    height: 100%;
    border-top-color: var(--primary-red);
    border-bottom-color: var(--primary-red);
    animation: spin-slow 8s linear infinite;
  }

  .ring-2 {
    width: 75%;
    height: 75%;
    border-left-color: var(--neon-red);
    border-right-color: var(--neon-red);
    animation: spin-fast 5s linear infinite reverse;
  }

  .ring-3 {
    width: 55%;
    height: 55%;
    border: 1px dashed rgba(255, 255, 255, 0.2);
    animation: spin-slow 12s linear infinite;
  }

  .node-core {
    position: relative;
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, #1a0000 0%, #000000 100%);
    border: 2px solid var(--primary-red);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 25px rgba(211, 17, 24, 0.5);
    z-index: 2;
    transition: all 0.2s ease;
  }

  .node-core img {
    width: 60%;
    height: auto;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
    transition: transform 0.3s ease;
  }

  .sync-node:hover .node-core {
    transform: scale(1.05);
    box-shadow: 0 0 40px var(--neon-red);
    background: radial-gradient(circle, #330000 0%, #000000 100%);
  }
  
  .sync-node:hover .ring-1, 
  .sync-node:hover .ring-2 {
    border-color: var(--neon-red);
    box-shadow: 0 0 20px rgba(255, 42, 49, 0.4) inset, 0 0 15px rgba(255, 42, 49, 0.5);
  }

  .sync-node:active .node-core {
    transform: scale(0.95);
  }

  .sync-node.is-syncing .ring-1 { animation: spin-fast 0.8s linear infinite; border-color: var(--ivory); }
  .sync-node.is-syncing .ring-2 { animation: spin-fast 0.5s linear infinite reverse; border-color: var(--ivory); }
  .sync-node.is-syncing .node-core {
    border-color: var(--ivory);
    box-shadow: 0 0 50px rgba(255,255,255,0.8);
    background: #fff;
  }
  .sync-node.is-syncing .node-core img {
    filter: brightness(0) invert(1);
    transform: scale(0.8);
  }
  .sync-node.is-syncing + .tap-hint {
    opacity: 0;
  }

  .tap-hint {
    margin-top: 32px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--primary-red);
    text-transform: uppercase;
    animation: pulse 2s ease-in-out infinite;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  @keyframes spin-slow { 100% { transform: rotate(360deg); } }
  @keyframes spin-fast { 100% { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; text-shadow: 0 0 10px var(--primary-red); }
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 49;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .modal-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* ดีไซน์หน้าต่างรับข้อความแบบ Sci-Fi */
  .result {
    --theme-color: #d31118; /* Default color (will be overridden by JS) */
    position: fixed;
    top: 50%; left: 50%;
    z-index: 50;
    width: 92%;
    max-width: 440px;
    background: rgba(10, 10, 15, 0.9);
    border: 1px solid var(--theme-color);
    box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 15px var(--theme-color);
    text-align: left;
    opacity: 0;
    transform: translate(-50%, -40%) scale(0.95);
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    
    /* ตัดมุมหน้าต่างแบบล้ำสมัย (Chamfered corners) */
    clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
  }
  .result.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  /* เส้น Grid ด้านใน */
  .result-inner {
    position: relative;
    padding: 30px 24px;
    border: 1px dashed rgba(255, 255, 255, 0.15);
    margin: 4px;
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  }

  .result .label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--theme-color);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--theme-color);
    text-shadow: 0 0 8px var(--theme-color);
  }
  .result .label .status {
    font-size: 11px;
    color: var(--ivory);
    background: var(--theme-color);
    padding: 2px 6px;
    text-shadow: none;
  }
  
  .result p {
    font-family: 'Sarabun', sans-serif;
    font-size: clamp(15px, 3.5vw, 17px);
    font-weight: 300;
    line-height: 1.7;
    margin: 0 0 32px;
    color: var(--ivory);
  }

  .close-btn {
    display: block;
    width: 100%;
    background: rgba(0, 0, 0, 0.5);
    color: var(--theme-color);
    border: 1px solid var(--theme-color);
    padding: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }
  .close-btn:hover {
    background: var(--theme-color);
    color: #fff;
    box-shadow: 0 0 15px var(--theme-color);
  }

  footer{
    margin-top:auto;
    color:var(--muted);
    font-size:13px;
    text-align:center;
  }
</style>
</head>

  const syncNode = document.getElementById('syncNode');
  const result = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const senderName = document.getElementById('senderName');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const closeBtn = document.getElementById('closeBtn');

  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('intro-screen').classList.add('fade-out');
      document.getElementById('main-ui').classList.add('show');
    }, 2800);
  });

  let isSyncing = false;

  function triggerSync() {
    if (isSyncing) return;
    isSyncing = true;
    
    syncNode.classList.add('is-syncing');

    // สุ่มเมมเบอร์ 1 คน จาก 5 คน
    const randomMemberIdx = Math.floor(Math.random() * membersData.length);
    const selectedMember = membersData[randomMemberIdx];

    // สุ่มข้อความจากใน Array ข้อความของเมมเบอร์คนนั้น
    const randomMessageIdx = Math.floor(Math.random() * selectedMember.messages.length);
    const selectedMessage = selectedMember.messages[randomMessageIdx];
    
    setTimeout(() => {
      syncNode.classList.remove('is-syncing');
      
      // อัปเดตเนื้อหา
      senderName.textContent = `INCOMING FROM: ${selectedMember.name}`;
      resultText.textContent = selectedMessage;
      
      // ฉีดสีประจำตัวเมมเบอร์เข้าไปใน CSS Variable ของ Modal
      result.style.setProperty('--theme-color', selectedMember.color);
      
      modalBackdrop.classList.add('show');
      result.classList.add('show');
      isSyncing = false;
    }, 2000);
  }

  function closeModal() {
    modalBackdrop.classList.remove('show');
    result.classList.remove('show');
  }

  syncNode.addEventListener('click', triggerSync);
  closeBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', closeModal);
</script>
