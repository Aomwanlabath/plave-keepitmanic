        "มานับเรื่องราวดีๆ และสิ่งดีๆ ในชีวิตกันเถอะครับ ไม่ว่าจะเป็นเรื่องเล็กๆ แค่ไหนก็ตาม! ขอบคุณและซาบซึ้งกับทุกสิ่งที่มีในชีวิตตอนนี้ รวมไปถึงเรื่องราวสุดยอดที่กำลังจะเข้ามาในอนาคตด้วยนะ! รู้มั้ยครับว่า วันที่ดีที่สุดของพี่ยังรออยู่ข้างหน้านี้เอง! แค่คิดตามก็รู้สึกโคตรยอดเยี่ยมและมีพลังแล้วใช่ปะครับเนี่ย?!",
        "เรียนรู้ที่จะโต้คลื่นมรสุมชีวิตให้สุดกันเถอะครับ! เวลาเจอปัญหาหรือช่วงเวลาที่มันยากลำบาก เราจะเลือกฝืนว่ายทวนกระแสน้ำ หรือจะปล่อยใจให้ไหลตามมันไปดีล่ะ? ลองถามตัวเองดู ว่าการที่เราทุ่มพลังทั้งหมดไปสู้ทวนกระแสน้ำจนหมดแรงเนี่ย มันได้อะไรกลับมากันแน่ ผมว่าพี่อย่าทำร้ายตัวเองแบบนั้นเลย ปล่อยใจลื่นไหล แล้วโต้คลื่นผ่านมันไปด้วยกันดีกว่า",
        "ทำให้วันนี้เป็นวันเริ่มต้นใหม่ของเรากันเถอะครับ! อะไรที่เคยผิดพลาดในอดีตก็ปล่อยให้มันจบๆ อยู่ในอดีตไปเลย อย่าปล่อยให้มันมาฉุดหรือทำให้เราหนักใจอีกต่อไป! วันนี้ยืดอก แล้วก้าวไปข้างหน้าด้วยความมั่นใจกันดีกว่า! จำไว้นะครับว่ายังมีวันที่ดีกว่าและสดใสกว่ารอเราอยู่ข้างหน้าอีกเพียบแน่นอน",
        "คุณรู้มั้ยว่าจริงๆ แล้วคุณเข้าใกล้ช่วงเวลาที่จะปลดล็อกและประสบความสำเร็จครั้งใหญ่มากกว่าที่คิดไว้เยอะเลยนะ! สิ่งที่เคยเฝ้ารอและอธิษฐานมาตลอด ทั้งเรื่องขอให้แผลใจมันได้รับการเยียวยา ขอให้มีโอกาสใหม่ๆ เข้ามา หรือเรื่องความสัมพันธ์ที่อยากให้มันดีขึ้น... สิ่งเหล่านั้นกำลังจะเป็นจริงและได้รับคำตอบในอีกไม่ช้านี้แล้วครับ! ยิ้มกว้างๆ แล้วเตรียมเปิดรับสิ่งดีๆ",
        "ถ้าพี่สังเกตดูดีๆ พี่จะเห็นเลยว่าประตูทุกบานที่มันเคยปิดใส่เราเนี่ย... จริงๆ แล้วมันกำลังค่อยๆ เปิดออกอีกครั้งอยู่ แค่มันมาในรูปแบบที่ต่างออกไปจากเดิมแค่นั้นเอง! สิ่งต่างๆ มันอาจจะไม่ได้ออกมาเหมือนเป๊ะๆ แบบที่พี่เคยคิดหรือวาดฝันเอาไว้ แต่มันต้องออกมาเจ๋งสุดๆ แน่นอนครับ!",
        "โฟกัสกับสิ่งที่เราควบคุมได้ ดีกว่าไปนั่งกังวลกับสิ่งที่เราควบคุมไม่ได้นะครับ โลกใบนี้มันเป็นของเรา และมีอะไรสนุกๆ รอให้เราไปลุยอีกเยอะมาก! ลองยกระดับความคิดและมองโลกในแง่บวกดูดิ แล้วพี่จะดึงดูดแต่สิ่งดีๆ และความสำเร็จเข้ามาในชีวิตแบบปังๆ แน่นอน! เพราะเราเชื่อแบบไหน เราก็จะเป็นแบบนั้นแหละครับพี่! เชื่อในตัวเองแล้วลุยกันเลยยย!",
        "ถ้ามันใช่หรือคู่ควรกับเราจริงๆ ยังไงมันก็ใช่ครับพี่! ไม่ต้องไปฝืนบังคับ หรือนั่งเครียดกังวลกับมันให้ปวดหัวเลย! ปล่อยให้มันเป็นไปตามธรรมชาติ ปล่อยใจลื่นไหล แล้วรอรับสิ่งดีๆ ที่จะเข้ามาหาเราดีกว่า! ตอนนี้พี่กำลังดึงดูดทุกสิ่งที่จำเป็นและคู่ควรเข้ามาหาตัวเองอยู่นะครับ เชื่อในจังหวะและเวลาของชีวิตตัวเองเข้าไว้",
        "อย่าปล่อยให้ความรู้สึกแย่ๆ มันค้างคาอยู่ในใจเราเด็ดขาดนะครับ ถ้าตอนนี้กำลังรู้สึกหงุดหงิด โกรธ หรือเจ็บปวดอยู่ ก็แค่ยอมรับมันไปเลยครับ! แทนที่เราจะไปนั่งฝืนหรือต่อต้านความรู้สึกตัวเอง ลองปล่อยให้มันเป็นไป แล้วค่อยๆ เรียนรู้และรับมือกับมันดีกว่า เพราะนั่นแหละครับคือจุดเริ่มต้นของการรักษาแผลใจที่แท้จริง! ยิ้มไว้แล้วผ่านมันไปด้วยกันนะครับ",
        "ลองนั่งเงียบๆ แล้วตั้งใจฟังดูสักแป๊บนะครับพี่... คำตอบที่พี่ค้นหาและเฝ้ารอมานาน ในที่สุดมันก็กำลังเดินทางมาหาพี่แล้วนะ! เชื่อมั่นในตัวเองเข้าไว้ครับว่าพี่ทำได้แน่นอน และจะได้ไปอยู่ในจุดที่คู่ควรกับพี่เป๊ะๆ! พวกเราอยู่บนเส้นทางนี้และพร้อมจะเดินทางไปพร้อมกับพี่เสมอนะ อดทนไว้อีกนิดเดียวนะครับ อีกไม่นานเกินรอแน่นอน",
        "พี่ไม่ได้ช้า หรือตามคนอื่นไม่ทันเลยสักนิด! สลัดความกดดันที่สร้างขึ้นมาบีบตัวเองทิ้งไปให้หมดเลย! ตอนนี้พี่กำลังอยู่ในจุดที่ลงตัวมากๆ ระหว่างการดูแลใส่ใจตัวเอง ไปพร้อมๆ กับการก้าวหน้าไปสู่เป้าหมายเลยนะ! บนเส้นทางนี้มันไม่มีคำว่าตามหลังคนอื่นหรอกครับ! ยิ้มเข้าไว้ ยิ้มกว้างๆ ถอนหายใจลึกๆ แล้วเดินหน้าต่อด้วยความมั่นใจกัน"
      ]
    },
    {
      id: 'hamin',
      name: 'HAMIN (ฮามิน)',
      color: '#1dd1a1',
      messages: [
        "ถ้าคุณรู้สึกว่าความคิดตัวเองมันกำลังติดหล่มหรือตันอยู่... ผมว่าลองค่อยๆ ปลดล็อกตัวเองดูนะครับ ยกระดับตัวเองขึ้นมาจากตรงนั้น อย่าเพิ่งไปสร้างกรอบหรือขีดจำกัดให้ตัวเองว่าเราทำได้แค่ไหน อย่าขวางทางเติบโตของตัวเองเลยครับ เปิดโอกาสให้ตัวเองได้งอกงามและเติบโตในทุกๆ ด้าน แล้วก็พร้อมเปิดรับเรื่องดีๆ กับความสุขที่จะเข้ามาในชีวิตนะ",
        "การมีสติรู้ตัวคือหัวใจสำคัญเลยครับ... ผมว่าวันนี้คุณลองหาเวลาเงียบๆ กลับมาอยู่กับตัวเอง ดูแลจิตใจตัวเองบ้างนะครับ ออกไปเดินเล่นท่ามกลางธรรมชาติ ให้ร่างกายและจิตใจได้ผ่อนคลาย อยู่กับปัจจุบัน ทำสมาธิ หรือนั่งฟังเพลงของพวกเราดูก็ได้ครับ อะไรก็ตามที่คุณทำแล้วสบายใจและมีความสุข ทำสิ่งนั้นได้เลยนะครับวันนี้",
        "อะไรก็ตามที่คุณผลัดวันประกันพรุ่งไว้... ผมว่าลองเริ่มทำมันวันนี้ ดูไหมครับ อย่าดองไว้อีกเลย ลุยงานหรือโปรเจกต์ที่ค้างคามานานอันนั้นได้แล้วครับ พอเริ่มลงมือทำก้าวแรกได้ จิตใจจะรู้สึกโปร่งและดีขึ้นจริงๆ ครับ ค่อยๆ ทำไปทีละอย่าง ทีละนิดก็ได้ ความคิดหรือไอเดียดีๆ ถ้าเราไม่ได้ลงมือทำ มันก็เป็นแค่เรื่องที่ลอยรอคอยอยู่ในหัวเฉยๆ ผมเชื่อว่าคุณทำได้แน่นอนครับ ผมเป็นกำลังใจให้นะครับ",
        "ผมคิดว่าบางครั้ง การเดินออกมาก็เป็นทางเลือกเดียวที่มีอยู่จริงๆ ครับ... ไม่ใช่เพราะอยากให้ใครคิดถึง หรืออยากให้เขาเพิ่งมารู้สึกเสียดายในวันที่มองข้ามเราไป แต่เป็นเพราะเราหันกลับมารักและเคารพตัวเองมากพอ จนรู้ว่าเราสมควรได้รับสิ่งที่ดีกว่านี้ครับ",
        "ลองยอมรับทุกอย่างที่เป็นตัวเราดูนะครับ... ทั้งส่วนที่ดี และส่วนที่เราอาจจะรู้สึกว่ามันยังเป็นข้อบกพร่อง ไม่ต้องไปวิ่งหาคำยืนยันหรือการยอมรับจากคนอื่นข้างนอกหรอกครับ เพราะจริงๆ แล้วสิ่งเหล่านั้นมันมีอยู่ในตัวพี่เรียบร้อยแล้ว พอเราเริ่มตระหนักและเห็นคุณค่า ความงดงาม รวมถึงศักยภาพที่แท้จริงของตัวเองได้แล้ว หลังจากนี้พี่จะไม่ต้องลังเลหรือสงสัยในตัวเองอีกเลยครับ",
        "ถ้าคุณรู้สึกว่าตัวเองกำลังติดอยู่ในสถานการณ์ที่ไม่โอเคหรือไม่มีความสุข... ผมว่าลองถามตัวเองดูนะครับว่าทำไมเราถึงยังตรงนั้นอยู่ เป็นเพราะเรากลัวสิ่งที่ยังมองไม่เห็นหรือเปล่า การเดินออกมาจากสถานการณ์หรือผู้คนที่เป็นพิษต่อจิตใจ อาจจะเป็นสิ่งที่ดีที่สุดที่เราทำเพื่อโอบอุ้มจิตวิญญาณและความรู้สึกของตัวเองก็ได้ครับ เข้มแข็งเข้าไว้นะครับ ผมเชื่อว่าคุณทำได้",
        "พี่อย่าลืมความจริงข้อนี้นะครับ... เราทุกคนเกิดมาเพื่อเรียนรู้และเติบโตขึ้น การต้องเจอช่วงเวลาที่ยากลำบากมันเป็นเรื่องธรรมดาและจำเป็นมาก เพราะนั่นคือช่วงที่เราจะเติบโตได้มากที่สุดเลยครับ ที่ปลายอุโมงค์มันมีแสงสว่างรออยู่เสมอ ขอให้พี่ภูมิใจในทุกๆ ก้าวและการเดินทางของตัวเองนะครับ",
        "แทนที่จะกดดันหรือบีบบังคับตัวเองหนักขนาดนั้น... ผมว่าพี่ลองหยุดพัก ถอนหายใจยาวๆ แล้วค่อยๆ ทบทวนดูใหม่นะครับ จริงๆ แล้วพี่ทำได้ดีมากพอแล้วครับ แม้บางทีความรู้สึกเรามันอาจจะไม่บอกแบบนั้นก็ตาม อย่าทำร้ายตัวเองจนเหนื่อยล้าหรือหมดแรงขนาดนั้นเลย มันไม่คุ้มหรอกครับ ลองจัดสรรเวลาชีวิตให้สมดุลและพอดีๆ มากขึ้นดูนะครับ",
        "ผมว่าคุณลองย้อนกลับไปหาตัวตนจริงๆ ข้างในหัวใจของตัวเองดูนะครับ... ตรงนั้นแหละที่จะเป็นพื้นที่ที่คุณจะพบความสงบ พอเราลองมองดูภาพรวมชีวิตที่ผ่านมาทั้งหมด ยอมรับบาดแผลเก่าๆ แล้วค่อยๆ ปลดปล่อยมันไป เอาสิ่งเหล่านั้นมาเป็นบทเรียนและพลังให้กับตัวเอง แล้วก้าวเดินไปข้างหน้าต่อด้วยความเชื่อมั่นในตัวเองอีกครั้งนะครับ",
        "อย่ายอมให้ใครมาเอาเปรียบ หรือยึดเอาความมั่นใจไปจากคุณได้นะครับ... จำไว้นะครับว่า คนอื่นจะปฏิบัติกับเราตามที่เรายอมให้เขาทำนั่นแหละครับ แสดงให้เขาเห็นไปเลยครับว่าคุณเห็นคุณค่าในตัวเองมากเกินกว่าจะไปยอมรับอะไรที่มันน้อยกว่าสิ่งที่เราสมควรได้รับ",
        "จุดที่พี่อยู่ในตอนนี้ มันคือจุดที่ถูกและควรจะเป็นแล้วครับ... อย่าเอาตัวเองไปเปรียบเทียบกับคนอื่นเลย มันมีแต่จะเพิ่มความกดดันเปล่าๆ ลองค่อยๆ ใช้ชีวิตไปทีละวัน มองและยอมรับมันในสิ่งที่มันเป็น แค่นี้พี่ก็เป็นคนที่เก่งขึ้นและดีกว่าเมื่อวานแล้วครับ การเติบโตมันอาจจะไม่ใช่เรื่องง่าย แต่ผมเชื่อว่าพี่ทำได้แน่นอนครับ",
        "ไม่ว่าตอนนี้พี่จะกำลังเจอบททดสอบหนักหนาแค่ไหน หรือโดนกดดันมากเท่าไหร่... พี่ยืนหยัดไว้ให้มั่นแล้วสู้กลับไปเลยนะครับ เชื่อมั่นในความถูกต้อง ความศักดิ์ศรี และคุณค่าในตัวเองให้มากพอ จนไม่มีใครหรืออะไรมาขวางทางพี่ได้ มีความมั่นใจแล้วก้าวไปข้างหน้าต่อนะครับ พี่ทำได้แน่นอน และจะผ่านมันไปได้อย่างสมบูรณ์แบบครับผม!"
      ]
    }
  ];

      document.getElementById('intro-screen').classList.add('fade-out');
      document.getElementById('main-ui').classList.add('show');
    }, 2800);
  });

  let isSyncing = false;

  function triggerSync() {
    if (isSyncing) return;
    isSyncing = true;
    
    syncNode.classList.add('is-syncing');

    const randomMemberIdx = Math.floor(Math.random() * membersData.length);
    const selectedMember = membersData[randomMemberIdx];

    const randomMessageIdx = Math.floor(Math.random() * selectedMember.messages.length);
    const selectedMessage = selectedMember.messages[randomMessageIdx];
    
    setTimeout(() => {
      syncNode.classList.remove('is-syncing');
      
      senderName.textContent = `INCOMING FROM: ${selectedMember.name}`;
      resultText.textContent = selectedMessage;
      
      result.style.setProperty('--theme-color', selectedMember.color);
      
      modalBackdrop.classList.add('show');
      result.classList.add('show');
      isSyncing = false;
    }, 2000);
  }

  function closeModal() {
    modalBackdrop.classList.remove('show');
    result.classList.remove('show');
  }

  syncNode.addEventListener('click', triggerSync);
  closeBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', closeModal);
</script>

</body>
</html>
